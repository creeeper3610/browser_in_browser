<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インブラウザ・デモ (GitHub Pages安定版)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f0f2f5; }
        
        /* ツールバーのスタイル */
        .toolbar { display: flex; padding: 10px; background: #333; gap: 10px; align-items: center; z-index: 100; }
        .address-bar { flex-grow: 1; padding: 6px 12px; border: none; border-radius: 4px; font-size: 14px; }
        .btn { background: #555; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #777; }
        
        /* サイト描画エリア (iframeではない通常のdiv) */
        .browser-viewport { 
            flex-grow: 1; 
            background: white; 
            overflow-y: auto; 
            padding: 20px;
            position: relative;
        }
        
        /* 読み込み中表示 */
        .loader { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #666; }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="text" id="url-input" value="https://wikipedia.org" class="address-bar" placeholder="URLを入力 (例: https://wikipedia.org)">
        <button id="go-btn" class="btn">読み込み</button>
    </div>

    <div class="browser-viewport" id="viewport">
        <div id="loader" class="loader">読み込み中...</div>
        <div id="content-area"><!-- ここに外部サイトのHTMLが注入されます --></div>
    </div>

<script>
    const urlInput = document.getElementById('url-input');
    const goBtn = document.getElementById('go-btn');
    const contentArea = document.getElementById('content-area');
    const loader = document.getElementById('loader');

    // 【修正】GitHub Pagesでも動作する、安定性の高い別のCORSプロキシサービスに変更
    const CORS_PROXY = "https://corsproxy.io/?url=";

    async function loadWebsite() {
        let targetUrl = urlInput.value.trim();
        
        if (!/^https?:\/\//i.test(targetUrl)) {
            targetUrl = 'https://' + targetUrl;
        }
        urlInput.value = targetUrl;

        contentArea.innerHTML = '';
        loader.style.display = 'block';

        try {
            // 新しいプロキシURLと、エンコードしたターゲットURLを結合して直接フェッチ
            const response = await fetch(CORS_PROXY + encodeURIComponent(targetUrl));
            if (!response.ok) throw new Error('ページの取得に失敗しました。');
            
            // corsproxy.ioは生テキスト（HTML）をそのまま返すため、直接text()で受け取れます
            const htmlText = await response.text();

            // 取得した文字列をHTML構造としてパース
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');

            // 外部サイトの画像やCSSの相対リンクを絶対リンクに書き換える
            fixRelativePaths(doc, targetUrl);

            // bodyの中身をiframeを使わずにそのまま現在のdiv要素に注入
            contentArea.innerHTML = doc.body.innerHTML;

            // 外部サイトのCSSスタイルを現在のページに適用
            const styles = doc.querySelectorAll('style, link[rel="stylesheet"]');
            styles.forEach(style => document.head.appendChild(style.cloneNode(true)));

        } catch (error) {
            contentArea.innerHTML = `<p style="color:red; padding:20px;">エラーが発生しました: ${error.message}</p>`;
        } finally {
            loader.style.display = 'none';
        }
    }

    // 相対パスを解決する補助関数
    function fixRelativePaths(doc, baseUrl) {
        const attributes = ['src', 'href'];
        attributes.forEach(attr => {
            doc.querySelectorAll(`[${attr}]`).forEach(el => {
                const val = el.getAttribute(attr);
                if (val && !/^https?:\/\//i.test(val) && !val.startsWith('data:')) {
                    try {
                        el.setAttribute(attr, new URL(val, baseUrl).href);
                    } catch(e) {}
                }
            });
        });
    }

    // イベントの紐付け
    goBtn.addEventListener('click', loadWebsite);
    urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loadWebsite(); });

    // 最初に起動した時点で自動読み込み
    loadWebsite();
</script>
</body>
</html>
